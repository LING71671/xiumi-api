name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 零第三方依赖，直接跑仓库自带的扫描器。
      # 退出码非 0 即存在 BLOCK 项，构建失败。
      - name: Scan for credentials and personal data
        run: python scripts/misc/secret_scan.py
